   name: Avisos do Planner

   on:
     schedule:
       - cron: '*/5 * * * *'   # a cada 5 minutos (o GitHub pode atrasar alguns minutos)
     workflow_dispatch:         # botão "Run workflow" para rodar na hora

   permissions:
     contents: read
     actions: write

   concurrency:
     group: avisos-planner
     cancel-in-progress: false

   jobs:
     enviar:
       runs-on: ubuntu-latest
       timeout-minutes: 5
       env:
         TZ: America/Sao_Paulo
       steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
             node-version: 20

         - name: Instalar dependências
           working-directory: avisos
           run: npm install --omit=dev --no-audit --no-fund

         - name: Enviar avisos
           working-directory: avisos
           env:
             FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
           run: node enviar-avisos.js

         # evita que o GitHub desligue o agendamento depois de 60 dias sem mudanças no repositório
         - uses: gautamkrishnar/keepalive-workflow@v2
